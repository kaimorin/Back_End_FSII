spring:
  application:
    name: ms-nutrivida
  datasource:
    url: ${DB_URL:jdbc:h2:mem:nutrivida}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:9005}

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:nutrivida-super-secret-key-must-be-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health