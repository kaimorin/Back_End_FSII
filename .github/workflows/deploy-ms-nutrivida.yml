name: CI/CD ms-nutrivida → EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # Job 1 — Tests unitarios + cobertura JaCoCo
  test:
    name: Tests & JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Ejecutar tests y generar reporte JaCoCo
        run: mvn -B verify -Pcoverage

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  # Job 2 — Build JAR y deploy en EC2 (solo si tests pasan)
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR (tests ya corrieron en job anterior)
        run: mvn -q -B clean package -DskipTests

      - name: Copiar docker-compose y Dockerfile a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "docker-compose.yml,Dockerfile"
          target: "/home/${{ secrets.EC2_USER }}/micros/ms-nutrivida"

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "target/app.jar"
          target: "/home/${{ secrets.EC2_USER }}/micros/ms-nutrivida"
          strip_components: 1

      - name: Deploy con Docker Compose en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/micros/ms-nutrivida

            # Escribir .env con variables sensibles
            cat > .env << ENVEOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            ENVEOF

            export DOCKER_BUILDKIT=0
            export COMPOSE_BAKE=false

            echo "=== Espacio en disco ==="
            df -h /

            echo "=== Bajando contenedores ==="
            docker compose down || true

            echo "=== Limpiando capas rotas (sin borrar volúmenes/DB) ==="
            docker system prune -f
            docker builder prune -f || true

            echo "=== Build sin caché ==="
            docker compose build --no-cache || {
              echo "Primer build falló, reintentando con limpieza total..."
              docker system prune -af
              docker compose build --no-cache
            }

            echo "=== Levantando ==="
            docker compose up -d

            echo "=== Esperando healthcheck (60 s máx) ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:9005/actuator/health > /dev/null; then
                echo "✔ App UP en intento $i"
                docker compose ps
                exit 0
              fi
              echo "Intento $i/12: aún no levanta, esperando 5 s..."
              sleep 5
            done

            echo "✖ App no levantó en 60 s, logs:"
            docker compose ps
            docker compose logs ms-nutrivida --tail 100
            docker compose logs nutrivida-db --tail 30
            exit 1