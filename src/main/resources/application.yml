spring:
  application:
    name: ms-nutrivida
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/nutrivida?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true

server:
  port: ${SERVER_PORT:9005}

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}            # 15 min 
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1800000}  # 30 min

management:
  endpoints:
    web:
      exposure:
        include: health
