# ── Perfil por defecto: H2 en memoria, sin instalar nada ──────────────
spring.application.name=nutrivida-backend

# Base H2 en memoria
spring.datasource.url=jdbc:h2:mem:nutrivida
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 (solo dev) → http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS: lee variable de entorno, por defecto apunta al Vite del frontend
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health
