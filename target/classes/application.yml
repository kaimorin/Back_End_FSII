spring:
  application:
    name: ms-nutrivida
  datasource:
    url: ${DB_URL:jdbc:mysql://<rds>:3306/nutrivida?...}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${SERVER_PORT:9005}

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}