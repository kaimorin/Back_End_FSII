services:
  ms-nutrivida:
    build: .
    container_name: ms-nutrivida
    ports:
      - "9005:9005"
    environment:
      DB_URL: jdbc:mysql://db:3306/nutrivida?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: admin
      DB_PASSWORD: yvanni123
      SERVER_PORT: 9005
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: nutrivida-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: nutrivida
      MYSQL_USER: admin
      MYSQL_PASSWORD: yvanni123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - nutrivida_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  nutrivida_data: