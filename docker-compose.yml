version: "3.9"

services:
  # ── Backend Spring Boot ─────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: nutrivida
      DB_USER: nutrivida
      DB_PASSWORD: nutrivida123
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  # ── MySQL 8 ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: nutrivida
      MYSQL_USER: nutrivida
      MYSQL_PASSWORD: nutrivida123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
