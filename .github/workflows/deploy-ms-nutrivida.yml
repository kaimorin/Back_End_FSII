name: Deploy ms-nutrivida a EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Código fuente ───────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      # ── 2. Compilar JAR en GitHub ──────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR (skip tests)
        run: mvn -q -B clean package -DskipTests

      # ── 3a. Subir docker-compose.yml y Dockerfile ──────────────────────
      - name: Copiar archivos de configuración a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "docker-compose.yml,Dockerfile"
          target: "/home/${{ secrets.EC2_USER }}/micros/ms-nutrivida"

      # ── 3b. Subir el JAR (strip_components quita el prefijo "target/") ──
      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "target/app.jar"
          target: "/home/${{ secrets.EC2_USER }}/micros/ms-nutrivida"
          strip_components: 1

      # ── 4. Crear .env e iniciar con Docker Compose ─────────────────────
      - name: Deploy con Docker Compose en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/micros/ms-nutrivida

            # Escribir .env con todas las variables sensibles
            cat > .env << ENVEOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            ENVEOF

            # ── FIX: Apagar buildkit/bake (tu EC2 no tiene buildx) ──
            export DOCKER_BUILDKIT=0
            export COMPOSE_BAKE=false

            echo "=== Espacio en disco ==="
            df -h /

            echo "=== Bajando contenedores ==="
            docker compose down || true

            echo "=== Limpiando caché roto de Docker (SIN borrar volúmenes/DB) ==="
            docker system prune -f
            docker builder prune -f || true

            echo "=== Build sin caché ==="
            docker compose build --no-cache || {
              echo "Primer build falló, reintentando con limpieza total..."
              docker system prune -af
              docker compose build --no-cache
            }

            echo "=== Levantando ==="
            docker compose up -d

            # Verificar que el contenedor levantó - espera hasta 60s
            echo "=== Esperando healthcheck ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:9005/actuator/health > /dev/null; then
                echo " App UP en intento $i"
                docker compose ps
                exit 0
              fi
              echo "Intento $i/12: aún no levanta, esperando 5s..."
              sleep 5
            done

            echo " App no levantó, logs:"
            docker compose ps
            docker compose logs ms-nutrivida --tail 100
            docker compose logs nutrivida-db --tail 30
            exit 1